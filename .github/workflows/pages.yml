name: Publish GRO to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep only the newest deployment when several commits arrive together.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out GRO
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GRO website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Publish GRO
        id: deployment
        uses: actions/deploy-pages@v5
