/* Individual life-plot identities */
.plot-detail{--plot-accent:#63845c;--plot-wash:#edf2e8;--plot-deep:#294b35}

.plot-banner p{position:relative;z-index:1;max-width:680px;color:#fffdf0d9}
.plot-kicker{font:11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:#f2e7c7}
.plot-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}

.plot-item{padding:11px 0;border-bottom:1px solid #ece9df}

.plot-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.plot-form input,.plot-form select,.plot-form textarea{min-width:0;width:100%;border:1px solid #d4dacd;border-radius:9px;padding:10px;background:white}
.plot-form textarea{grid-column:1/-1;resize:vertical}

@media(max-width:650px){.plot-grid{grid-template-columns:1fr}.plot-banner{padding:20px}.plot-banner:after{font-size:90px;right:10px}.plot-stats{gap:8px}.plot-stat{padding:11px}.plot-form{grid-template-columns:1fr}.plot-form .primary{width:100%}}


/* GRO 0.5 · Ethereal isometric world */
:root{background:#172238;color:#f1eee8}
body{background:radial-gradient(ellipse at 50% -10%,#64728b 0,#26354e 45%,#131e31 100%);color:#f1eee8}
.sidebar{background:linear-gradient(180deg,#1b2940,#111c2e);border-right:1px solid #ffffff20;color:#f5efdf}
.brand{color:#f1ddb0;text-shadow:0 0 22px #d4c5ec88}.tag{color:#c2ccda}
.nav{color:#e1e6ed}.nav.active,.nav:hover{background:#ffffff18;color:#f5dfb0}

.plots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 12px;position:relative;z-index:1}
.plot{position:relative;isolation:isolate;min-height:190px;border:0;border-radius:0;padding:0 10px 17px;color:#263c4b;background:transparent;box-shadow:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;transition:transform .25s;overflow:visible}
.plot:before{content:'';position:absolute;z-index:-2;left:4%;right:4%;top:22%;bottom:0;background:linear-gradient(145deg,var(--plot-wash),color-mix(in srgb,var(--plot-accent) 50%,#d9e1d2));clip-path:polygon(50% 0,100% 28%,100% 72%,50% 100%,0 72%,0 28%);filter:drop-shadow(0 15px 0 #1a303caa);transform:perspective(500px) rotateX(7deg)}
.plot:after{content:'';position:absolute;z-index:-1;left:9%;right:9%;top:28%;bottom:8%;background:linear-gradient(135deg,#ffffff66,transparent 65%);clip-path:polygon(50% 0,100% 28%,100% 72%,50% 100%,0 72%,0 28%);pointer-events:none}
.plot:hover{transform:translateY(-8px) scale(1.025);background:transparent;box-shadow:none}

.panel,.plot-panel,.stat-card{background:linear-gradient(145deg,#faf7ef,#e9e9e3);color:#2d3d52;border:1px solid #ffffff88;box-shadow:0 14px 36px #080f2055}

.plot-kicker{color:#f5e9cc}.plot-stat{background:#f1efe7}.plot-panel{border-top:4px solid var(--plot-accent);border-radius:18px}

.field textarea{min-height:300px;resize:vertical;line-height:1.75;padding:16px}.plot-form textarea{min-height:120px;resize:vertical;line-height:1.7}
.task{color:#33445a;border-color:#e1e4df}.task .muted{color:#788394}.primary{background:#455d79}.secondary{background:#e5e8e5;color:#35485f}.chip{background:#e6e9e5;color:#4b5c70}.footer{color:#aab7c5}
@media(max-width:1000px){.plots{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}}
@media(max-width:650px){.garden{padding:15px 10px 20px}.plots{gap:12px 4px}.plot{min-height:155px;padding:0 5px 13px}.plot .plant{font-size:46px}.plot strong{font-size:14px}.plot small{font-size:9px}.plot-banner{min-height:215px;padding:20px}.plot-banner:after{font-size:120px;right:0}.plot-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.field textarea{min-height:240px}}

/* GRO 0.6 · Hybrid isometric living world */
.world-intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:8px 0 25px}
.world-kicker{font:11px Arial,sans-serif;letter-spacing:2.5px;color:#d8cba9;text-transform:uppercase}
.world-intro h1{font-size:clamp(34px,4.3vw,58px);margin:9px 0;color:#fbf1df}
.world-intro p{color:#c8d4dc;margin:0}
.world-weather{border:1px solid #ffffff38;border-radius:20px;padding:12px 17px;color:#f4e8ca;background:#ffffff12;white-space:nowrap}
.world-weather small{display:block;color:#c5d4d6;margin-top:5px}
.living-world{position:relative;overflow:hidden;border:1px solid #d8e2d35c;border-radius:32px;padding:25px 22px 18px;background:radial-gradient(ellipse at 50% 35%,#b2c9bd 0,#799e98 40%,#405f6c 100%);box-shadow:inset 0 0 90px #1b344788,0 25px 70px #07101e88}
.world-sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.sky-star{position:absolute;color:#fff1cc;opacity:.7}.star-one{left:10%;top:13%;font-size:28px}.star-two{right:9%;top:43%;font-size:35px}.star-three{left:50%;top:6%;font-size:42px}
.sky-cloud{position:absolute;width:150px;height:38px;border-radius:50%;background:#ffffff18;filter:blur(13px)}.cloud-one{left:4%;top:32%}.cloud-two{right:4%;top:20%}
.world-heading{position:relative;z-index:2;display:flex;justify-content:space-between;gap:12px;align-items:center;color:#fff4d9;font:11px Arial,sans-serif;letter-spacing:2px;margin:3px 8px 0}

.world-map{position:relative;z-index:1;display:block;width:100%;height:auto;overflow:visible;margin:-5px auto -10px}

.world-spot:hover,.world-spot:focus{filter:drop-shadow(0 8px 8px #122a36aa);transform:translateY(-5px)}
.world-spot:focus .spot-title{paint-order:stroke;stroke:#fff4d7;stroke-width:5px}
.spot-title{font: bold 17px Georgia,serif;fill:#263c4b;paint-order:stroke;stroke:#f5f0df;stroke-width:3px;stroke-linejoin:round}
.spot-sub{font:10px Arial,sans-serif;fill:#344e57;paint-order:stroke;stroke:#e8e6d5;stroke-width:2px}
.world-decoration{pointer-events:none;filter:drop-shadow(0 5px 3px #233f3d66)}
.banga-world{pointer-events:none;filter:drop-shadow(0 5px 5px #1e364655);animation:bangaFloat 3.5s ease-in-out infinite}
.banga-world{filter:drop-shadow(0 5px 6px #1e364655);pointer-events:none}.banga-fairy{filter:drop-shadow(0 2px 2px #26394d66)}.banga-sparkles{animation:sparklePulse 1.8s ease-in-out infinite alternate}@keyframes sparklePulse{from{opacity:.35}to{opacity:1}}

.companion-copy{min-width:0}.companion-copy .world-kicker{color:#718077}.companion-copy p{margin:6px 0 9px;color:#46586a}

.world-tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 5px}

/* Banga's attentive flight */
.banga-world{filter:drop-shadow(0 5px 6px #1e364655);pointer-events:none}.banga-fairy{filter:drop-shadow(0 2px 2px #26394d66)}.banga-wings{transform-box:fill-box;transform-origin:center;animation:wingBeat .24s ease-in-out infinite alternate}@keyframes wingBeat{from{transform:scaleY(.72) rotate(-7deg)}to{transform:scaleY(1.08) rotate(7deg)}}.banga-sparkles{animation:sparklePulse 1.4s ease-in-out infinite alternate}@keyframes sparklePulse{from{opacity:.25}to{opacity:1}}

/* GRO 0.9 · Individual living biomes */
.biome-scene{--biome-accent:var(--plot-accent);position:relative;isolation:isolate;min-height:410px;overflow:hidden;border:1px solid #ffffff66;border-radius:30px;margin:20px 0 24px;background:linear-gradient(180deg,#b6c9c5 0%,#8ea9a0 43%,#658b7b 100%);box-shadow:inset 0 -35px 80px #183b3a44,0 22px 55px #07111f66}
.biome-sky{position:absolute;inset:0 0 30%;overflow:hidden;background:linear-gradient(180deg,#b9c9d2aa,#f4dfc055 75%,transparent)}
.biome-sun{position:absolute;right:15%;top:12%;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff4cf,#f6e8c588 45%,transparent 72%);box-shadow:0 0 55px #fff0c477}
.biome-cloud{position:absolute;width:190px;height:36px;border-radius:50%;background:#ffffff48;filter:blur(12px)}
.biome-cloud.c1{left:9%;top:24%}.biome-cloud.c2{right:30%;top:38%;transform:scale(.7)}
.biome-skyline{position:absolute;left:-5%;right:-5%;bottom:0;height:35%;background:linear-gradient(180deg,#ffffff00,#6f9b8a44)}
.biome-hill{position:absolute;left:-10%;width:120%;border-radius:50%}

const goalsHTML=pd.goals.length?pd.goals.map(g=>`<div class="plot-item"><div class="plot-item-head"><strong>${escapeHTML(g.title)}</strong><span class="chip">${g.done?'Achieved':(Number(g.progress)||0)+'%'}</span></div>${g.due?`<small>Target date: ${escapeHTML(g.due)}</small>`:''}<div class="plot-progress"><div style="width:${g.done?100:Math.max(0,Math.min(100,Number(g.progress)||0))}%"></div></div><div class="row"><input aria-label="Goal progress" type="range" min="0" max="100" step="5" value="${g.done?100:Number(g.progress)||0}" data-goal-range="${g.id}" style="flex:1;accent-color:var(--plot-accent)"><button class="mini" data-goal-done="${g.id}">${g.done?'Reopen':'Mark achieved'}</button></div></div>`).join(''):'<div class="empty">No goals planted here yet.</div>';
const habitsHTML=pd.habits.length?pd.habits.map(h=>{const done=(h.completedDates||[]).includes(day());return `<div class="plot-item"><div class="plot-item-head"><strong>${escapeHTML(h.title)}</strong><label class="step"><input type="checkbox" data-habit="${h.id}" ${done?'checked':''}><span>Today</span></label></div><small>${escapeHTML(h.cadence||'Daily')} · ${(h.completedDates||[]).length} check-ins recorded</small></div>`}).join(''):'<div class="empty">No habits growing here yet.</div>';
const milestonesHTML=pd.milestones.length?pd.milestones.map(x=>`<div class="plot-item"><div class="plot-item-head"><label class="step ${x.done?'done':''}"><input type="checkbox" data-milestone="${x.id}" ${x.done?'checked':''}><span><strong>${escapeHTML(x.title)}</strong></span></label><span class="chip">${x.done?'Reached':'Upcoming'}</span></div>${x.due?`<small>Target: ${escapeHTML(x.due)}</small>`:''}${x.done&&x.completedAt?`<small>Reached ${new Date(x.completedAt).toLocaleDateString('en-GB')}</small>`:''}</div>`).join(''):'<div class="empty">No milestones recorded yet.</div>';
const notesHTML=pd.notes.length?pd.notes.slice().reverse().map(n=>`<div class="plot-note"><small>${new Date(n.date).toLocaleString('en-GB')}</small><div>${escapeHTML(n.text)}</div></div>`).join(''):'<div class="empty">Your plot journal is waiting for its first note.</div>';
const deadlinesHTML=deadlines.length?deadlines.slice(0,8).map(d=>`<div class="plot-item"><div class="plot-item-head"><strong>${escapeHTML(d.title)}</strong><span class="chip">${escapeHTML(d.type)}</span></div><small>Due ${escapeHTML(d.due)}</small></div>`).join(''):'<div class="empty">No upcoming deadlines in this plot.</div>';
const history=[...doneItems.map(t=>({title:t.title,date:t.completedAt||'',type:'Task harvested'})),...pd.milestones.filter(x=>x.done).map(x=>({title:x.title,date:x.completedAt||'',type:'Milestone reached'})),...pd.goals.filter(g=>g.done).map(g=>({title:g.title,date:g.completedAt||'',type:'Goal achieved'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const historyHTML=history.length?history.slice(0,10).map(x=>`<div class="plot-item"><strong>${escapeHTML(x.title)}</strong><br><small>${x.type}${x.date?' · '+new Date(x.date).toLocaleDateString('en-GB'):''}</small></div>`).join(''):'<div class="empty">Your first harvest will appear here.</div>';
const plotJournal=data.journal.filter(j=>j.plot===selectedPlot);
html=`<div class="plot-detail" style="--plot-accent:${m.accent};--plot-deep:${m.deep};--plot-wash:${m.wash}">
<button class="secondary plot-back" data-page="garden">← Back to the garden</button>
${biomeScene}<div class="plot-banner" data-symbol="${m.symbol}"><div class="plot-kicker">${escapeHTML(m.tag)}</div><h1>${p[2]} ${p[1]} Garden</h1><p>${escapeHTML(m.desc)}</p><p class="plot-kicker">${escapeHTML(m.ecosystem)}</p></div>
<div class="plot-stats"><div class="plot-stat"><span class="muted">Task growth</span><strong>${score}%</strong></div><div class="plot-stat"><span class="muted">Active tasks</span><strong>${openItems.length}</strong></div><div class="plot-stat"><span class="muted">Goals achieved</span><strong>${goalDone}/${pd.goals.length}</strong></div><div class="plot-stat"><span class="muted">Today's habits</span><strong>${habitToday}/${pd.habits.length}</strong></div></div>
<div class="plot-grid">
<section class="plot-panel" id="biome-goals"><h2>🌱 Goals</h2><p class="muted">Longer-term intentions for this part of your life.</p>${goalsHTML}<form class="plot-form" data-plot-form="goal"><input name="title" required maxlength="160" placeholder="Plant a new goal"><input name="due" type="date" aria-label="Goal target date"><button class="primary">Add goal</button></form></section>
<section class="plot-panel" id="biome-tasks"><h2>🪴 Tasks</h2><p class="muted">The next actions that move this plot forward.</p>${taskList(items)}<button class="primary" data-add="${selectedPlot}">+ Plant a task</button></section>
<section class="plot-panel"><h2>🌿 Habits</h2><p class="muted">Gentle routines. Missed days never break the garden.</p>${habitsHTML}<form class="plot-form" data-plot-form="habit"><input name="title" required maxlength="120" placeholder="e.g. Practise piano"><select name="cadence" aria-label="Habit frequency"><option>Daily</option><option>Weekdays</option><option>Weekly</option><option>Flexible</option></select><button class="primary">Add habit</button></form></section>
<section class="plot-panel"><h2>🌸 Milestones</h2><p class="muted">Important stages and achievements along the way.</p>${milestonesHTML}<form class="plot-form" data-plot-form="milestone"><input name="title" required maxlength="160" placeholder="Name a milestone"><input name="due" type="date" aria-label="Milestone target date"><button class="primary">Add milestone</button></form></section>
<section class="plot-panel"><h2>🗓 Upcoming deadlines</h2><p class="muted">Tasks, goals and milestones with dates attached.</p>${deadlinesHTML}</section>
<section class="plot-panel"><h2>🏵 Historical achievements</h2><p class="muted">Completed tasks, achieved goals and reached milestones.</p>${historyHTML}</section>
<section class="plot-panel" id="biome-journal"><h2>📖 Plot journal</h2><p class="muted">Notes and reflections attached to this life area.</p>${plotJournal.length?plotJournal.slice().reverse().map(j=>`<div class="plot-note"><small>${escapeHTML(j.date)}</small><div>${escapeHTML(j.text)}</div></div>`).join(''):'<div class="empty">No reflections linked to this plot yet.</div>'}<form class="plot-form" data-plot-form="note"><textarea name="text" required rows="4" placeholder="Record an observation or reflection..."></textarea><button class="primary">Save note</button></form></section>
<section class="plot-panel"><h2>🌼 Growth progress</h2><p class="muted">A visual and measurable view of this plot's development.</p><div class="plot-progress"><div style="width:${score}%"></div></div><strong>${score}% task growth</strong><p class="muted">Based on completed tasks and tracked task progress. Goals and habits are shown separately so the measures stay transparent.</p><button class="mini" data-page="growth">Open Growth Observatory</button></section>
</div>
<div class="plot-advice" style="margin-top:16px"><div class="banga"><div class="avatar">🧚🏾‍♀️</div><div><strong>Banga's ${p[1]} garden note</strong><div class="muted">${phase()==='night'?'Banga is sleeping and dreaming. Her note is here for when you need it.':'A little observation from your garden companion.'}</div></div></div><p>${escapeHTML(plotAdvice(selectedPlot))}</p><em>${escapeHTML(m.question)}</em></div>
</div>`;
}
}else if(page==='growth'){
const tracked=all.filter(t=>t.tracking);
const overall=all.length?Math.round(all.reduce((sum,t)=>sum+(t.done?100:t.tracking?taskPercent(t):0),0)/all.length):0;
const active=all.filter(t=>!t.done).length;
const completed=all.filter(t=>t.done).length;
const plotRows=PLOTS.map(p=>{
 const items=all.filter(t=>t.plot===p[0]);
 const score=items.length?Math.round(items.reduce((sum,t)=>sum+(t.done?100:t.tracking?taskPercent(t):0),0)/items.length):0;
 return `<div class="plot-growth"><span>${p[2]} <strong>${p[1]}</strong></span><div class="progress"><div style="width:${score}%"></div></div><strong>${score}%</strong></div>`;
}).join('');
const trackedRows=tracked.length?tracked.map(t=>`<div class="growth-task"><div class="growth-task-head"><strong>${escapeHTML(t.title)}</strong><span class="chip">${t.done?'Harvested':taskPercent(t)+'%'}</span></div><div class="muted">${plotName(t.plot)} · ${t.method==='steps'?'Subtasks':t.method==='milestones'?'Milestones':'Manual progress'}</div><div class="task-progress"><div style="width:${t.done?100:taskPercent(t)}%"></div></div><button class="mini" data-progress="${t.id}">Update progress</button></div>`).join(''):'<div class="empty">No tracked tasks yet. Enable Progress Layer when planting a task to see its growth here.</div>';
html=`<h1>Growth Observatory ✧</h1><p class="muted">A wider view of what is moving, what is taking shape and what deserves your attention. Progress is a guide, not a judgement.</p>
<div class="stat-grid"><div class="stat-card"><span class="muted">Overall garden progress</span><strong>${overall}%</strong><div class="progress"><div style="width:${overall}%"></div></div></div><div class="stat-card"><span class="muted">Intentions harvested</span><strong>${completed}</strong><span class="muted">Completed tasks</span></div><div class="stat-card"><span class="muted">Still growing</span><strong>${active}</strong><span class="muted">${tracked.length} with progress tracking</span></div></div>
<div class="panel"><h2>Growth by life area</h2><p class="muted">Each plot averages its tasks: completed tasks count as 100%, tracked tasks use their current progress, and untracked open tasks count as not yet started.</p>${plotRows}</div>
<div class="panel"><h2>Tracked tasks</h2><p class="muted">Your task-level progress, subtasks and milestones all contribute to the relevant garden plot.</p>${trackedRows}</div>
<div class="panel"><h2>A note on the numbers</h2><p class="muted">These are simple progress indicators, not a score for your worth or wellbeing. You can pause, change direction or leave a plot resting. Nothing dies here.</p></div>`;
}else if(page==='journal'){html=`<h1>Growth journal</h1><p>Capture the little moments that deserve remembering.</p><div class="panel"><form id="journalForm"><label class="field">Today's reflection<textarea id="reflection" required rows="12" placeholder="What grew today?"></textarea></label><button class="primary">Save reflection</button></form></div><div class="panel"><h2>Past reflections</h2>${data.journal.length?data.journal.slice().reverse().map(j=>`<article class="plot-journal-entry"><div class="muted">${escapeHTML(j.date)}</div><div>${escapeHTML(j.text)}</div></article>`).join(''):'<div class="empty">Your story begins here.</div>'}</div>`}else if(page==='settings'){html=`<h1>Garden settings</h1><p>Personalise your space and keep a copy of your data.</p><div class="panel"><form id="settingsForm"><label class="field">Name<input id="name" value="${escapeHTML(data.name)}" required></label><label class="field">Banga wakes at<input type="time" id="wake" value="${escapeHTML(data.wake)}"></label><label class="field">Banga sleeps at<input type="time" id="sleep" value="${escapeHTML(data.sleep)}"></label><p class="muted">Timezone: Africa/Harare</p><button class="primary">Save settings</button></form></div><div class="panel"><h2>Your data</h2><p class="muted">This early version stores information only in this browser. It does not sync across devices.</p><div class="row"><button class="secondary" id="export">Export garden data</button><label class="secondary" style="cursor:pointer">Import data <input type="file" id="import" accept="application/json" style="display:none"></label></div></div>`}$('#page').innerHTML=html}
document.addEventListener('click',e=>{const n=e.target.closest('[data-page],[data-plot],[data-add],[data-toggle],[data-delete],[data-clearplot],[data-progress],[data-banga]');if(!n)return;if(n.dataset.page)navigate(n.dataset.page);if(n.dataset.plot)navigate('plot',n.dataset.plot);if(n.dataset.add)openTask(n.dataset.add);if('clearplot'in n.dataset)navigate('seeds');if(n.dataset.progress)openProgress(n.dataset.progress);if(n.dataset.banga){const talk=$('#bangaTalk');if(talk)talk.classList.toggle('visible');}if(n.dataset.focusPanel){const target=document.getElementById('biome-'+n.dataset.focusPanel);if(target)target.scrollIntoView({behavior:'smooth',block:'center'});}if(n.dataset.biomeBanga!==undefined){const companion=n.closest('.biome-banga');if(companion){companion.classList.toggle('note-open');n.setAttribute('aria-expanded',companion.classList.contains('note-open')?'true':'false');}}if(n.dataset.toggle){const t=data.tasks.find(t=>t.id===n.dataset.toggle);if(t){t.done=!t.done;if(t.tracking&&t.done){const old=taskPercent(t);if(t.method==='percent')t.progress=100;else (t.steps||[]).forEach(x=>x.done=true);recordProgress(t,old,'Task completed');}save();render()}}if(n.dataset.delete){if(confirm('Compost this task?')){data.tasks=data.tasks.filter(t=>t.id!==n.dataset.delete);save();render()}}});$('#closeModal').onclick=()=>$('#modal').close();$('#enableTracking').onchange=toggleTrackingUI;$('#trackingMethod').onchange=toggleTrackingUI;$('#closeProgress').onclick=()=>$('#progressModal').close();$('#progressForm').onsubmit=e=>{e.preventDefault();const t=data.tasks.find(x=>x.id===editingProgressId);if(!t)return;const old=taskPercent(t);if(t.method==='percent')t.progress=Number($('#progressRange').value);else document.querySelectorAll('[data-step]').forEach(c=>{t.steps[Number(c.dataset.step)].done=c.checked});recordProgress(t,old,$('#progressNote')?.value.trim()||'');save();$('#progressModal').close();render()};document.addEventListener('input',e=>{if(e.target.id==='progressRange')$('#progressValue').textContent=e.target.value+'%'});$('#taskForm').onsubmit=e=>{e.preventDefault();const tracking=$('#enableTracking').checked,method=$('#trackingMethod').value,steps=$('#taskSteps').value.split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,done:false}));data.tasks.push({id:crypto.randomUUID(),title:$('#taskTitle').value.trim(),plot:$('#taskPlot').value,due:$('#taskDate').value,done:false,tracking,method:tracking?method:null,progress:0,steps:tracking&&method!=='percent'?steps:[],history:[]});save();$('#modal').close();render()};document.addEventListener('submit',e=>{if(e.target.id==='journalForm'){e.preventDefault();data.journal.push({date:day(),text:$('#reflection').value.trim()});save();render()}if(e.target.id==='settingsForm'){e.preventDefault();data.name=$('#name').value.trim();data.wake=$('#wake').value;data.sleep=$('#sleep').value;save();render()}});document.addEventListener('click',e=>{if(e.target.id==='export'){const a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='gro-garden-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}});document.addEventListener('change',async e=>{if(e.target.id==='import'){try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.journal))throw Error('Invalid GRO backup');data=obj;save();render();alert('Garden restored.')}catch(err){alert('Could not import: '+err.message)}}});
document.addEventListener('submit',e=>{
 const form=e.target.closest('[data-plot-form]');
 if(!form)return;
 e.preventDefault();
 const kind=form.dataset.plotForm,pd=ensurePlotData(selectedPlot),fd=new FormData(form),title=String(fd.get('title')||'').trim(),due=String(fd.get('due')||'');
 if(kind==='goal'&&title)pd.goals.push({id:crypto.randomUUID(),title,due,progress:0,done:false,createdAt:new Date().toISOString()});
 if(kind==='habit'&&title)pd.habits.push({id:crypto.randomUUID(),title,cadence:String(fd.get('cadence')||'Daily'),completedDates:[],createdAt:new Date().toISOString()});
 if(kind==='milestone'&&title)pd.milestones.push({id:crypto.randomUUID(),title,due,done:false,createdAt:new Date().toISOString()});
 if(kind==='note'){const text=String(fd.get('text')||'').trim();if(text)pd.notes.push({id:crypto.randomUUID(),text,date:new Date().toISOString()})}
 save();render();
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.habit){const h=ensurePlotData(selectedPlot).habits.find(x=>x.id===el.dataset.habit);if(h){if(!Array.isArray(h.completedDates))h.completedDates=[];h.completedDates=el.checked?[...new Set([...h.completedDates,day()])]:h.completedDates.filter(d=>d!==day());save();render()}}
 if(el.dataset.milestone){const x=ensurePlotData(selectedPlot).milestones.find(x=>x.id===el.dataset.milestone);if(x){x.done=el.checked;x.completedAt=el.checked?new Date().toISOString():null;save();render()}}
 if(el.dataset.goalRange){const g=ensurePlotData(selectedPlot).goals.find(x=>x.id===el.dataset.goalRange);if(g){g.progress=Number(el.value);if(g.progress>=100){g.done=true;g.completedAt=new Date().toISOString()}else{g.done=false;g.completedAt=null}save();render()}}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-goal-done]');if(!b)return;
 const g=ensurePlotData(selectedPlot).goals.find(x=>x.id===b.dataset.goalDone);
 if(g){g.done=!g.done;g.progress=g.done?100:Math.min(95,Number(g.progress)||0);g.completedAt=g.done?new Date().toISOString():null;save();render()}
});

render();setInterval(()=>{if(!$('#modal').open)render()},60000);
</script></body></html>
