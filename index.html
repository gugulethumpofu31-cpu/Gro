<script>
const PLOTS=[['career','Career','🌳'],['education','Education','📚'],['home','Home','🏡'],['wellbeing','Wellbeing','🌿'],['creativity','Creativity','🌺'],['finance','Finance','🪙'],['relationships','Relationships','🌷'],['experiences','Experiences','🦋']];

const PLOT_META={
 career:{tag:'The Canopy of Ambition',desc:'A place for meaningful work, professional reputation and the opportunities you are cultivating.',symbol:'🌳',accent:'#66845b',deep:'#294b35',wash:'#edf2e8',advice:'Tend the work that compounds. A thoughtful professional relationship or a well-finished piece of research can grow branches for years.',question:'Which piece of work would make the greatest difference if you moved it forward today?',ecosystem:'Tall trees, climbing vines, a timber study pavilion and a clear path through the canopy.'},
 education:{tag:'The Library Grove',desc:'A quiet growing place for study, research, intellectual curiosity and academic milestones.',symbol:'📚',accent:'#9a8050',deep:'#57472d',wash:'#f3eee1',advice:'Knowledge grows through return visits. Give difficult ideas time to take root, then test what you have understood by explaining it in your own words.',question:'What is one idea you want to understand more deeply this week?',ecosystem:'An open-air library, reading benches, paper lanterns and shelves tucked between old trees.'},

function ensurePlotData(id){if(!data.plotData)data.plotData={};if(!data.plotData[id])data.plotData[id]={goals:[],habits:[],milestones:[],notes:[]};const d=data.plotData[id];['goals','habits','milestones','notes'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});return d}
function plotTasks(id){return data.tasks.filter(t=>t.plot===id)}

g&&method!=='percent'?steps:[],history:[]});save();$('#modal').close();render()};document.addEventListener('submit',e=>{if(e.target.id==='journalForm'){e.preventDefault();data.journal.push({date:day(),text:$('#reflection').value.trim()});save();render()}if(e.target.id==='settingsForm'){e.preventDefault();data.name=$('#name').value.trim();data.wake=$('#wake').value;data.sleep=$('#sleep').value;save();render()}});document.addEventListener('click',e=>{if(e.target.id==='export'){const a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='gro-garden-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}});document.addEventListener('change',async e=>{if(e.target.id==='import'){try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.tasks)||!Array.isArray(obj.journal))throw Error('Invalid GRO backup');data=obj;save();render();alert('Garden restored.')}catch(err){alert('Could not import: '+err.message)}}});
document.addEventListener('submit',e=>{
 const form=e.target.closest('[data-plot-form]');
 if(!form)return;
 e.preventDefault();
 const kind=form.dataset.plotForm,pd=ensurePlotData(selectedPlot),fd=new FormData(form),title=String(fd.get('title')||'').trim(),due=String(fd.get('due')||'');
 if(kind==='goal'&&title)pd.goals.push({id:crypto.randomUUID(),title,due,progress:0,done:false,createdAt:new Date().toISOString()});
 if(kind==='habit'&&title)pd.habits.push({id:crypto.randomUUID(),title,cadence:String(fd.get('cadence')||'Daily'),completedDates:[],createdAt:new Date().toISOString()});
 if(kind==='milestone'&&title)pd.milestones.push({id:crypto.randomUUID(),title,due,done:false,createdAt:new Date().toISOString()});
 if(kind==='note'){const text=String(fd.get('text')||'').trim();if(text)pd.notes.push({id:crypto.randomUUID(),text,date:new Date().toISOString()})}
 save();render();
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.habit){const h=ensurePlotData(selectedPlot).habits.find(x=>x.id===el.dataset.habit);if(h){if(!Array.isArray(h.completedDates))h.completedDates=[];h.completedDates=el.checked?[...new Set([...h.completedDates,day()])]:h.completedDates.filter(d=>d!==day());save();render()}}
 if(el.dataset.milestone){const x=ensurePlotData(selectedPlot).milestones.find(x=>x.id===el.dataset.milestone);if(x){x.done=el.checked;x.completedAt=el.checked?new Date().toISOString():null;save();render()}}
 if(el.dataset.goalRange){const g=ensurePlotData(selectedPlot).goals.find(x=>x.id===el.dataset.goalRange);if(g){g.progress=Number(el.value);if(g.progress>=100){g.done=true;g.completedAt=new Date().toISOString()}else{g.done=false;g.completedAt=null}save();render()}}
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-goal-done]');if(!b)return;
 const g=ensurePlotData(selectedPlot).goals.find(x=>x.id===b.dataset.goalDone);
 if(g){g.done=!g.done;g.progress=g.done?100:Math.min(95,Number(g.progress)||0);g.completedAt=g.done?new Date().toISOString():null;save();render()}
});

render();setInterval(()=>{if(!$('#modal').open)render()},60000);
</script></body></html>
