<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" role="img" aria-labelledby="title desc">
<title id="title">Banga, guardian of the GRO garden</title><desc id="desc">A regal African fairy with deep brown skin, long dark locs, gold adornments and emerald botanical clothing.</desc>
<defs>
 <linearGradient id="skin" x2="0.8" y2="1"><stop stop-color="#9c6048"/><stop offset=".55" stop-color="#75402f"/><stop offset="1" stop-color="#4b2928"/></linearGradient>
 <linearGradient id="cloth" x2="1" y2="1"><stop stop-color="#9ab77b"/><stop offset=".42" stop-color="#37694c"/><stop offset="1" stop-color="#173e37"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff0ad"/><stop offset=".45" stop-color="#d6ad59"/><stop offset="1" stop-color="#8f642f"/></linearGradient>
 <radialGradient id="wing"><stop stop-color="#fff8db" stop-opacity=".82"/><stop offset="1" stop-color="#c9e4d1" stop-opacity=".12"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<!-- luminous moth wings -->
<g opacity=".82" stroke="#f5e9c6" stroke-width="2">
