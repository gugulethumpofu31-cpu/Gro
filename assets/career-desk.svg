<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#e3d8b5"/><stop offset=".55" stop-color="#a9bd9b"/><stop offset="1" stop-color="#627d60"/></linearGradient>
 <linearGradient id="timber" x2="0" y2="1"><stop stop-color="#b98755"/><stop offset=".5" stop-color="#71472f"/><stop offset="1" stop-color="#392b25"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#d6a56b"/><stop offset=".25" stop-color="#95613b"/><stop offset="1" stop-color="#513629"/></linearGradient>
 <linearGradient id="window" x2="0" y2="1"><stop stop-color="#e8c58b"/><stop offset=".4" stop-color="#8fb5a0"/><stop offset="1" stop-color="#345d46"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#fff0b7" stop-opacity=".85"/><stop offset="1" stop-color="#ffda87" stop-opacity="0"/></radialGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
 <pattern id="woodgrain" width="100" height="24" patternUnits="userSpaceOnUse"><path d="M0 7Q28 0 52 7T100 7M0 18Q25 12 50 18T100 18" fill="none" stroke="#f3d29a" stroke-opacity=".15" stroke-width="2"/></pattern>
</defs>
<!-- warm timber study, open to the forest -->
<rect width="1200" height="520" fill="#59402e"/>
<rect width="1200" height="370" fill="url(#wall)"/>
<path d="M0 0H1200V38Q1000 70 800 34T400 40T0 34Z" fill="#284b37"/>
