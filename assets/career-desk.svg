 <rect x="62" y="160" width="27" height="72"/><rect x="99" y="170" width="22" height="62"/><rect x="130" y="155" width="30" height="77"/><rect x="171" y="165" width="25" height="67"/><rect x="207" y="158" width="30" height="74"/>
 <rect x="64" y="255" width="26" height="70"/><rect x="100" y="265" width="24" height="60"/><rect x="136" y="250" width="27" height="75"/><rect x="175" y="262" width="25" height="63"/><rect x="210" y="250" width="27" height="75"/>
</g>
